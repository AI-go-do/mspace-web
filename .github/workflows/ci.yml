# PR마다 테스트·타입 검사·빌드를 돌려서, 깨진 화면이 develop/main에 합쳐지지 않게 막는다.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 코드 받기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Node 22 설치
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: 의존성 설치
        run: npm ci --no-audit --no-fund

      - name: 테스트
        run: npm test

      - name: 빌드 (타입 검사 포함)
        run: npm run build
